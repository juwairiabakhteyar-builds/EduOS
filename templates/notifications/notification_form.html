{% extends "layouts/app.html" %}

{% block content %}
<div class="page-header">
    <div>
        <p class="eyebrow">COMMUNICATION</p>
        <h1>{{ page_title }}</h1>
        <p class="page-subtitle">Create a clear school-wide announcement.</p>
    </div>
</div>

<div class="card">
    <form method="post" class="form-grid">
        {% csrf_token %}
        {{ form.as_p }}

        <div class="form-actions">
            <a href="{% url 'notifications:list' %}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">Save Notification</button>
        </div>
    </form>
</div>
{% endblock %}
