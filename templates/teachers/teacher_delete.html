{% extends "layouts/app.html" %}

{% block title %}
Delete Teacher | EduOS
{% endblock %}

{% block content %}

<div class="page-container">

    <div class="card">

        <h2>Delete Teacher</h2>

        <p>

            Are you sure you want to delete

            <strong>{{ teacher.full_name }}</strong>?

        </p>

        <form method="POST">

            {% csrf_token %}

            <a
                href="{% url 'teacher_detail' teacher.pk %}"
                class="btn btn-secondary"
            >
                Cancel
            </a>

            <button
                class="btn btn-danger"
                type="submit"
            >
                Delete
            </button>

        </form>

    </div>

</div>

{% endblock %}
